<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auron Merch</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/productos.css">
    <link rel="stylesheet" href="css/inicio.css?v=2">
</head>
<body>

    <!-- ══════════════════════════════════════
         NAVBAR SUPERIOR
    ══════════════════════════════════════ -->
    <nav class="top-nav">
        <div class="nav-left">
            <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleDrawer()" aria-label="Menú">
                <span></span><span></span><span></span>
            </button>
        </div>

        <div class="nav-center">
            <a href="#" class="nav-logo">
                <img src="img/logo.jpeg" alt="Auron Merch" />
            </a>
        </div>

        <div class="nav-right">
            <!-- Bolsa de compras SVG -->
            <button class="cart-btn" id="cartBtn" onclick="toggleCart()" aria-label="Carrito">
                <svg class="cart-bag-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <path d="M16 10a4 4 0 0 1-8 0" />
                </svg>
                <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
            </button>
            <div class="nav-auth" id="navAuth"></div>
        </div>
    </nav>

    <!-- ══════════════════════════════════════
         DRAWER (menú lateral izquierdo)
    ══════════════════════════════════════ -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <aside class="drawer" id="drawer">
        <div class="drawer-header">
            <img src="img/logo.jpeg" alt="Auron Merch" />
            <button class="drawer-close" onclick="toggleDrawer()">✕</button>
        </div>
        <nav class="drawer-links">
            <a href="index.html">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z" />
                    <path d="M9 21V12h6v9" />
                </svg>
                Inicio
            </a>
            <a href="productos.html">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.57a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.57a2 2 0 0 0-1.34-2.23z" />
                </svg>
                Productos
            </a>
            <a href="sobreNosotros.html">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
                Sobre Nosotros
            </a>
            <a href="contacto.html">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                    <polyline points="22,6 12,13 2,6" />
                </svg>
                Contáctanos
            </a>
        </nav>
        <div class="drawer-divider"></div>
        <div class="drawer-categorias">
            <p class="filtro-label">CATEGORÍAS</p>
            <a class="filtro-btn" href="productos.html?cat=Todos">Todos</a>
            <a class="filtro-btn" href="productos.html?cat=T-Shirt">T-Shirt</a>
            <a class="filtro-btn" href="productos.html?cat=Hoodie">Hoodie</a>
            <a class="filtro-btn" href="productos.html?cat=Zapato">Zapato</a>
            <a class="filtro-btn" href="productos.html?cat=Accesorio">Accesorio</a>
        </div>
        <div class="drawer-footer" id="drawerAuth"></div>
    </aside>


    <!-- ══════════════════════════════════════
         CART PANEL (panel lateral derecho)
    ══════════════════════════════════════ -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <aside class="cart-panel" id="cartPanel">
        <div class="cart-panel-header">
            <div class="cart-panel-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <path d="M16 10a4 4 0 0 1-8 0" />
                </svg>
                <span>MI CARRITO</span>
            </div>
            <button class="cart-panel-close" onclick="toggleCart()">✕</button>
        </div>

        <div class="cart-items-list" id="cartItemsList">
            <div class="cart-empty" id="cartEmpty">
                <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--border)">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <path d="M16 10a4 4 0 0 1-8 0" />
                </svg>
                <p>Tu carrito está vacío</p>
                <span>Agrega productos para continuar</span>
            </div>
        </div>

        <div class="cart-footer" id="cartFooter" style="display:none;">
            <div class="cart-subtotal">
                <span>Subtotal</span>
                <span id="cartSubtotal">$0.00</span>
            </div>
            <div class="cart-total">
                <span>TOTAL</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="btn-checkout" onclick="checkout()">FINALIZAR COMPRA</button>
            <button class="btn-clear-cart" onclick="vaciarCarrito()">Vaciar carrito</button>
        </div>
    </aside>

    <!-- ══════════════════════════════════════
         CONTENIDO PRINCIPAL
    ══════════════════════════════════════ -->
    <main class="main-content">

        <!-- Form Admin -->
        <section class="form-container" id="formPanel">
            <h2 id="tituloForm">Agregar Producto</h2>
            <div class="form-grid">
                <input type="text" id="nombre" placeholder="Nombre del producto">
                <input type="number" id="precio" placeholder="Precio">
                <select id="categoria">
                    <option value="">Selecciona categoría</option>
                    <option value="T-Shirt">T-Shirt</option>
                    <option value="Hoodie">Hoodie</option>
                    <option value="Zapato">Zapato</option>
                    <option value="Accesorio">Accesorio</option>
                </select>
                <label class="file-label" id="fileLabel">
                    <input type="file" id="imagen" accept="image/*">
                    <span id="fileLabelText">Subir imagen</span>
                </label>
            </div>
            <img id="preview" style="display:none; width:140px; margin-top:12px; border-radius:8px; border:1px solid #2A2A2A;">
            <div class="form-buttons">
                <button id="btnGuardar" onclick="guardarProducto()">Guardar</button>
                <button class="btn-cancel" id="btnCancelar" onclick="limpiarInputs()" style="display:none;">Cancelar</button>
            </div>
        </section>

        <!-- Buscador -->
        <div class="search-wrap">
            <input type="text" id="buscador" placeholder="Buscar productos..." oninput="filtrar()">
            <span class="search-icon">⌕</span>
        </div>

        <!-- Header productos -->
        <div class="productos-header">
            <h2 class="section-title">PRODUCTOS</h2>
            <span id="contadorResultados" class="contador"></span>
        </div>

        <!-- Grid 3 columnas -->
        <div id="contenedorProductos" class="grid"></div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
