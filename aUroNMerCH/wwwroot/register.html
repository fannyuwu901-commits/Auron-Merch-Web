<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro — Auron</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <div class="auth-card">

        <!-- LOGO -->
        <div class="auth-logo">
            <img src="img/logo.png" alt="Auron Merch" />
        </div>

        <!-- NOMBRE TIENDA -->
        <span class="auth-brand">AURON MERCH</span>


        <!-- TÍTULO -->
        <h1 class="auth-title">REGISTRARSE</h1>

        <!-- FORMULARIO -->
        <div class="auth-form" id="authForm">

            <div class="field-group">
                <label class="field-label" for="username">USUARIO</label>
                <input class="field-input" type="text" id="username" placeholder="Tu nombre de usuario" autocomplete="username">
            </div>

            <div class="field-group">
                <label class="field-label" for="email">EMAIL</label>
                <input class="field-input" type="email" id="email" placeholder="tu@correo.com" autocomplete="email">
            </div>

            <div class="field-group">
                <label class="field-label" for="password">CONTRASEÑA</label>
                <input class="field-input" type="password" id="password" placeholder="••••••••" autocomplete="new-password">
            </div>

            <button class="btn-submit" onclick="register()">CREAR CUENTA</button>

            <div id="mensaje"></div>

        </div>

        <!-- LINK LOGIN -->
        <p class="auth-footer-text">
            ¿Ya tienes cuenta?
            <a href="login.html" class="auth-link">Inicia sesión</a>
        </p>

    </div>

    <script src="js/register.js"></script>
</body>
</html>
