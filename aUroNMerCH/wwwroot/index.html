<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Auron Merch</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>Auron Merch</h1>
    </header>

    <section class="form-container">
        <h2 id="tituloForm">Agregar Producto</h2>

        <input type="text" id="nombre" placeholder="Nombre del producto">
        <input type="number" id="precio" placeholder="Precio">
        <select id="categoria">
            <option value="">Selecciona categoría</option>
            <option value="T-Shirt">T-Shirt</option>
            <option value="Hoodie">Hoodie</option>
            <option value="Zapato">Zapato</option>
            <option value="Accesorio">Accesorio</option>
        </select>

        <input type="file" id="imagen" name="imagen" accept="image/*">

     
        <img id="preview" style="display:none; width:120px; margin-top:10px; border-radius:10px;">

        <div class="form-buttons">
            <button id="btnGuardar" onclick="guardarProducto()">Guardar</button>
            <button id="btnCancelar" onclick="limpiarInputs()" style="display:none;">
                Cancelar
            </button>
        </div>
    </section>

    <section class="productos">
        <h2>Productos</h2>
        <div id="contenedorProductos" class="grid"></div>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
