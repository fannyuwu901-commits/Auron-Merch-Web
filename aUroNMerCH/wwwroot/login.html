<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Auron Merch</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
  
</head>
<body>

    <div class="login-card">
        <div class="card-accent-line"></div>

        <!-- Logo + Brand -->
        <div class="logo-wrap">
            <img class="logo-img" src="img/logo.png" alt="Auron Merch Logo">
            <span class="brand-name">AURON MERCH</span>
        </div>

        <!-- Divider con label -->
        <div class="divider">
            <div class="divider-line"></div>
            <span class="login-label">Iniciar Sesión</span>
            <div class="divider-line"></div>
        </div>

        <!-- Campos -->
        <div class="field">
            <label for="username">Usuario</label>
            <input type="text" id="username" placeholder="Tu usuario">
        </div>

        <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button class="btn-login" onclick="login()">ENTRAR</button>

        <p id="error" class="error"></p>

        <div class="register-row">
            ¿No tienes cuenta?&nbsp;
            <button onclick="window.location.href='register.html'">Regístrate</button>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
